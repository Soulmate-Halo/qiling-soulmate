name: 需求建议
description: 分享你的想法，帮助规划器灵 Soulmate 的未来方向
title: "[Feature] 简要描述你的建议"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！好的建议能帮助我们决定路线图的优先级。请先搜索是否已有类似的 Issue。
  - type: textarea
    id: problem
    attributes:
      label: 你要解决的问题
      description: 你想解决什么痛点，或在什么场景下需要这个能力。
      placeholder: 例如：在多个 AI CLI 协同的场景下，我希望……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你的建议
      description: 描述你希望新增或改进的功能，以及它应该如何工作。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他方案，以及为什么建议当前方案更合适。
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: 补充说明
      description: 其他想补充的信息（截图、参考链接、相关领域经验等）。
    validations:
      required: false
